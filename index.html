<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch TV Shows Online, Watch Movies Online</title>
    <!-- Favicon link pointing to official Netflix asset for authenticity -->
    <link rel="icon" href="https://nflxext.com" type="image/x-icon">
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --primary-color: #E50914;
            --primary-hover: #C11119;
            --bg-color: #000000;
            --card-bg: #2D2D2D;
            --card-hover: #414141;
            --text-color: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.7);
            --border-color: #232323;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 700px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.9) 100%), 
                        url('https://nflxext.com');
            background-size: cover;
            background-position: center;
            border-bottom: 8px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 10%;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .logo svg {
            fill: var(--primary-color);
            width: 150px;
            height: 40px;
        }

        .header-buttons {
            display: flex;
            gap: 20px;
        }

        .lang-btn {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .signin-btn {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            padding: 6px 18px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .signin-btn:hover {
            background-color: var(--primary-hover);
        }

        .hero-content {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 800px;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .hero-content h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* EMAIL FORM */
        .email-form-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .email-form-container h3 {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 15px;
        }

        .cta-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            position: relative;
            flex: 1;
            min-width: 300px;
        }

        .cta-form input {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .cta-form input:focus {
            border-color: var(--text-color);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .cta-btn {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: none;
            padding: 14px 30px;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .cta-btn:hover {
            background-color: var(--primary-hover);
        }

        /* FEATURE SECTIONS (GRID FEATURES) */
        .feature-row {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 10%;
            border-bottom: 8px solid var(--border-color);
            max-width: 1200px;
            margin: 0 auto;
            gap: 40px;
        }

        .feature-row.reverse {
            flex-direction: row-reverse;
        }

        .feature-text {
            flex: 1;
        }

        .feature-text h2 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .feature-text p {
            font-size: 1.5rem;
            line-height: 1.4;
            color: var(--text-color);
        }

        .feature-img-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .feature-img-wrapper img {
            max-width: 100%;
            height: auto;
            z-index: 2;
        }

        /* FAQ SECTION (ACCORDION) */
        .faq-section {
            padding: 70px 10%;
            border-bottom: 8px solid var(--border-color);
            text-align: center;
        }

        .faq-section h2 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 40px;
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto 50px auto;
            text-align: left;
        }

        .faq-item {
            margin-bottom: 10px;
            background-color: var(--card-bg);
            transition: background-color 0.2s;
        }

        .faq-item:hover {
            background-color: var(--card-hover);
        }

        .faq-question {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 400;
            user-select: none;
        }

        .faq-toggle-icon {
            font-size: 2.2rem;
            font-weight: 300;
            transition: transform 0.2s ease;
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s cubic-bezier(0.5, 0, 0.1, 1);
            border-top: 2px solid var(--bg-color);
        }

        .faq-answer p {
            padding: 24px;
            font-size: 1.4rem;
            line-height: 1.4;
            color: var(--text-color);
        }

        .faq-item.active .faq-toggle-icon {
            transform: rotate(45deg);
        }

        /* FOOTER */
        footer {
            max-width: 1000px;
            margin: 0 auto;
            padding: 70px 10% 40px 10%;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-contact {
            margin-bottom: 30px;
        }

        .footer-contact a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-contact a:hover {
            text-decoration: underline;
        }

        .footer-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-attribution {
            margin-top: 20px;
            font-size: 0.8rem;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 950px) {
            .hero-content h1 { font-size: 2.2rem; }
            .hero-content h2 { font-size: 1.2rem; }
            .feature-row, .feature-row.reverse { flex-direction: column; text-align: center; padding: 50px 5%; }
            .feature-text h2 { font-size: 2.2rem; }
            .feature-text p { font-size: 1.1rem; }
            .faq-section h2 { font-size: 2.2rem; }
            .faq-question { font-size: 1.2rem; padding: 18px; }
            .faq-answer p { font-size: 1.1rem; padding: 18px; }
            header { padding: 20px 5%; }
            .logo svg { width: 110px; height: 30px; }
        }

        @media (max-width: 500px) {
            .cta-form { flex-direction: column; width: 100%; }
            .input-group { width: 100%; min-width: unset; }
            .cta-btn { font-size: 1.1rem; width: auto; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <!-- HERO / HEAD HEADER SECTION -->
    <div class="hero">
        <header>
            <div class="logo">
                <!-- Authentic Netflix Logo Graphic Component via SVG -->
